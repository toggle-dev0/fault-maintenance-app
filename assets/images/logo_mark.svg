<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FixTrack logo mark"><title>FixTrack logo mark</title><style>.bg{fill:var(--accent,#E0E7FF)}.bgc{fill:var(--status-critical-bg,#FFE4E6)}.cd{fill:var(--card,#FFFFFF);stroke:var(--border,#E2E8F0);stroke-width:2}.pr{fill:var(--primary,#4F46E5)}.pf{fill:var(--primary-foreground,#FFFFFF)}.in{fill:var(--muted,#F1F5F9)}.ln{fill:var(--border,#E2E8F0)}.sh{fill:var(--shadow-color,#0F172A);opacity:.08}.okc{fill:var(--status-resolved-fg,#065F46)}.crc{fill:var(--status-critical-fg,#9F1239)}.pgb{fill:var(--status-progress-bg,#E0F2FE)}.pgc{fill:var(--status-progress-fg,#075985)}.rsb{fill:var(--status-resolved-bg,#D1FAE5)}.rsc{fill:var(--status-resolved-fg,#065F46)}.rpc{fill:var(--status-reported-fg,#92400E)}.ck{fill:none;stroke:var(--card,#FFFFFF);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.pk{fill:none;stroke:var(--primary-foreground,#FFFFFF);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.hd{fill:none;stroke:var(--primary,#4F46E5);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.tri{fill:var(--card,#FFFFFF);stroke:var(--status-critical-fg,#9F1239);stroke-width:10;stroke-linejoin:round}.pls{fill:none;stroke:var(--primary,#4F46E5);stroke-width:4;stroke-linecap:round}</style><rect class="pr" width="64" height="64" rx="18"/><polygon class="pf" points="32.0,13.0 48.5,22.5 48.5,41.5 32.0,51.0 15.5,41.5 15.5,22.5"/><circle class="pr" cx="32" cy="32" r="7"/></svg>
